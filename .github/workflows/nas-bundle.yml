name: Publish single-container NAS app to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main, feat/bjj-journey-2]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_name == 'main' || github.ref_name == 'feat/bjj-journey-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build single-container Linux AMD64 image
        run: |
          docker build --platform linux/amd64 --target single \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t ghcr.io/cloudcookch/bjj-journey:2.0-single .

      - name: Smoke test the single-container NAS app
        shell: bash
        run: |
          staging=$(mktemp -d)
          cp compose.single.yaml "$staging/compose.yaml"
          cd "$staging"
          umask 077
          {
            printf 'NEXTAUTH_URL=http://127.0.0.1:3190\nAPP_PORT=3190\n'
            printf 'NEXTAUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
          } > .env.docker
          cleanup() {
            docker compose --env-file .env.docker down --volumes
            rm -rf -- "$staging"
          }
          trap cleanup EXIT
          docker compose --env-file .env.docker up -d --pull never --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:3190/api/auth/session |
            jq --exit-status '. == {}'
          count=$(docker compose --env-file .env.docker exec -T -u postgres app psql -Atc 'SELECT count(*) FROM training_exercise_catalog')
          test "$count" -ge 135

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        run: docker push ghcr.io/cloudcookch/bjj-journey:2.0-single
