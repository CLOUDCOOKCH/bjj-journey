x-postgres-client: &postgres-client
  DB_DRIVER: postgres
  PGHOST: db
  PGDATABASE: bjj_journey
  PGUSER: bjj_journey
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bjj_journey
      POSTGRES_USER: bjj_journey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bjj_journey", "-d", "bjj_journey"]
      interval: 3s
      timeout: 3s
      retries: 20

  init:
    image: ghcr.io/cloudcookch/bjj-journey-init:2.0-nas
    environment: *postgres-client
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/cloudcookch/bjj-journey:2.0-nas
    restart: unless-stopped
    environment:
      <<: *postgres-client
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env.docker}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.docker}
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
