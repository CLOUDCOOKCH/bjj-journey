services:
  app:
    image: ghcr.io/cloudcookch/bjj-journey:2.0-single
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env.docker}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.docker}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - bjj-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/session').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
volumes:
  bjj-data:
